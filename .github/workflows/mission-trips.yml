name: mission-trips

on:
  push:
    paths: ["mission-trips/**", ".github/workflows/mission-trips.yml"]
  pull_request:
    paths: ["mission-trips/**", ".github/workflows/mission-trips.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-trips
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mission
          POSTGRES_PASSWORD: mission_ci_pw
          POSTGRES_DB: mission_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mission" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway values. Real secrets never live in the repository.
      APP_ENV: test
      DATABASE_URL: postgresql://mission:mission_ci_pw@localhost:5432/mission_test
      TEST_DATABASE_URL: postgresql://mission:mission_ci_pw@localhost:5432/mission_test
      E2E_DATABASE_URL: postgresql://mission:mission_ci_pw@localhost:5432/mission_e2e
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mission-trips/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Create end-to-end database
        run: PGPASSWORD=mission_ci_pw psql -h localhost -U mission -d mission_test -c 'CREATE DATABASE mission_e2e'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: mission-trips/test-results
